<!DOCTYPE html>
<html lang="en" class="locked">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#070a1c" />

    <title>&#9829;</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        color-scheme: dark;
        --bg0: #070a1c;
        --bg1: #120f30;
        --bg2: #0b0f2e;
        --text: #f6f3f8;
        --muted: rgba(246, 243, 248, 0.62);
        --faint: rgba(246, 243, 248, 0.4);
        --line: rgba(255, 255, 255, 0.1);
        --card: rgba(255, 255, 255, 0.045);
        --rose: #ff8fa3;
        --rose-digit: #ffd6de;
        --sky: #7cc4ff;
        --sky-digit: #d4eaff;
        --serif: "Cormorant Garamond", Georgia, serif;
        --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 60%, var(--bg2) 100%);
        color: var(--text);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* ---------- backdrop ---------- */
      #sky,
      #fx {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      #sky {
        z-index: 0;
      }

      #fx {
        z-index: 3;
        pointer-events: none;
      }

      .glow {
        position: fixed;
        z-index: 0;
        pointer-events: none;
        border-radius: 50%;
      }

      .glow-a {
        width: 70vmax;
        height: 70vmax;
        left: -25vmax;
        top: -30vmax;
        background: radial-gradient(circle, rgba(255, 143, 163, 0.22) 0%, rgba(255, 143, 163, 0) 62%);
        animation: drift-a 28s ease-in-out infinite alternate;
      }

      .glow-b {
        width: 80vmax;
        height: 80vmax;
        right: -35vmax;
        bottom: -40vmax;
        background: radial-gradient(circle, rgba(124, 196, 255, 0.2) 0%, rgba(124, 196, 255, 0) 62%);
        animation: drift-b 36s ease-in-out infinite alternate;
      }

      @keyframes drift-a {
        to {
          transform: translate(8vmax, 6vmax);
        }
      }

      @keyframes drift-b {
        to {
          transform: translate(-8vmax, -5vmax);
        }
      }

      /* ---------- layout ---------- */
      .page {
        position: relative;
        z-index: 1;
        max-width: 840px;
        margin: 0 auto;
        padding: var(--sky-pad, 76px) 20px 64px;
        transition: opacity 1.6s ease;
      }

      .hero {
        text-align: center;
        margin-bottom: 40px;
      }

      h1 {
        margin: 0;
        font: 600 clamp(44px, 8vw, 70px) / 1.05 var(--serif);
        letter-spacing: 0.01em;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.2em;
      }

      .beat {
        display: inline-block;
        animation: beat 1.1s ease-in-out infinite;
      }

      .heart {
        background: none;
        border: 0;
        padding: 0 0.05em;
        margin: 0;
        cursor: pointer;
        font: inherit;
        line-height: 1;
        color: var(--rose);
        text-shadow: 0 0 22px rgba(255, 143, 163, 0.55);
        display: inline-block;
        -webkit-tap-highlight-color: transparent;
      }

      .heart:focus-visible {
        outline: 2px solid rgba(255, 143, 163, 0.6);
        outline-offset: 6px;
        border-radius: 8px;
      }

      .heart.pop {
        animation: pop 0.55s cubic-bezier(0.2, 0.9, 0.2, 1);
      }

      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        14% {
          transform: scale(1.14);
        }
        28% {
          transform: scale(1);
        }
        42% {
          transform: scale(1.09);
        }
        56% {
          transform: scale(1);
        }
      }

      @keyframes pop {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.45) rotate(-6deg);
        }
        100% {
          transform: scale(1);
        }
      }

      .tagline {
        margin: 14px 0 0;
        font: italic 500 clamp(19px, 3vw, 24px) / 1.3 var(--serif);
        color: var(--muted);
      }

      /* ---------- cards ---------- */
      .card {
        position: relative;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 26px 28px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s ease;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(520px 180px at 12% 0%, rgba(255, 255, 255, 0.07), transparent 60%);
        pointer-events: none;
      }

      .card:hover {
        border-color: rgba(255, 255, 255, 0.18);
        transform: translateY(-2px);
      }

      .wait.done {
        border-color: rgba(255, 143, 163, 0.45);
        box-shadow: 0 0 0 1px rgba(255, 143, 163, 0.2), 0 24px 70px rgba(255, 143, 163, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .wait-grid {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 28px;
        align-items: start;
      }

      .divider {
        width: 1px;
        align-self: stretch;
        background: linear-gradient(180deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
      }

      .progress {
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        margin-top: 28px;
        overflow: hidden;
      }

      .progress .bar {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--rose), var(--sky));
        box-shadow: 0 0 16px rgba(124, 196, 255, 0.45);
        transition: width 1s linear;
      }

      .progress-label {
        margin: 10px 0 0;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
        color: var(--faint);
        letter-spacing: 0.02em;
      }

      .progress-label .right {
        color: var(--muted);
      }

      /* ---------- clocks ---------- */
      .clock {
        position: relative;
        min-width: 0;
      }

      .label {
        margin: 0 0 16px;
        font: 500 12px/1.4 var(--sans);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .time {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, auto));
        justify-content: space-between;
        column-gap: 14px;
        row-gap: 10px;
      }

      .u {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .n {
        display: inline-flex;
        font-weight: 700;
        font-size: var(--digit, 38px);
        line-height: 1;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        color: var(--rose-digit);
        text-shadow: 0 0 26px rgba(255, 143, 163, 0.28);
      }

      .countdown .n {
        color: var(--sky-digit);
        text-shadow: 0 0 26px rgba(124, 196, 255, 0.32);
      }

      .d {
        display: inline-block;
        --dir: 0.55em;
      }

      .countdown .d {
        --dir: -0.55em;
      }

      .d.roll {
        animation: roll 0.46s cubic-bezier(0.2, 0.8, 0.25, 1);
      }

      @keyframes roll {
        from {
          transform: translateY(var(--dir));
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }

      .unit {
        font: italic 500 15px/1 var(--serif);
        letter-spacing: 0.03em;
        color: var(--muted);
      }

      .detail {
        margin: 16px 0 0;
        font-size: 13px;
        line-height: 1.6;
        color: var(--faint);
      }

      .wait .clock {
        --digit: 40px;
      }

      /* ---------- sections ---------- */
      .section-title {
        margin: 48px 0 18px;
        font: 600 clamp(24px, 4vw, 30px) / 1.2 var(--serif);
        letter-spacing: 0.01em;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .section-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--line), transparent);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .grid .card {
        padding: 24px 26px;
        --digit: 34px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .tile {
        padding: 20px 14px;
        text-align: center;
      }

      .tile .big {
        display: inline-flex;
        justify-content: center;
        font-weight: 700;
        font-size: clamp(17px, 2.4vw, 22px);
        line-height: 1.1;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }

      .tile .what {
        margin-top: 8px;
        font: italic 500 15px/1.3 var(--serif);
        color: var(--muted);
      }

      footer {
        margin-top: 56px;
        text-align: center;
        font: italic 500 16px/1.5 var(--serif);
        color: var(--faint);
      }

      /* ---------- the planets ---------- */
      .orrery {
        margin: 0 0 8px;
      }

      .orb-stage {
        position: relative;
        width: 100%;
        height: 480px;
      }

      .orb-stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .moments {
        position: relative;
        display: flex;
        justify-content: space-between;
        max-width: 640px;
        margin: -10px auto 0;
        touch-action: pan-y;
        -webkit-user-select: none;
        user-select: none;
      }

      .moments-line {
        position: absolute;
        left: 30px;
        right: 30px;
        top: 17px;
        height: 1px;
        background: var(--line);
      }

      .moments-fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--rose), var(--sky));
        box-shadow: 0 0 10px rgba(124, 196, 255, 0.35);
        transition: width 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      .moments.scrubbing .moments-fill {
        transition: none;
      }

      .moment {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
        width: 60px;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .moment .moon {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 0.4s ease;
      }

      .moment:hover .moon {
        transform: scale(1.1);
      }

      .moment.on .moon {
        transform: scale(1.2);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.28), 0 0 26px rgba(255, 255, 255, 0.3);
      }

      .moment:focus-visible {
        outline: none;
      }

      .moment:focus-visible .moon {
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.7);
      }

      .moment .d {
        font: 500 10.5px/1 var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        white-space: nowrap;
        transition: color 0.3s ease;
      }

      .moment.on .d {
        color: var(--text);
      }

      .moment-info {
        margin-top: 26px;
        text-align: center;
        transition: opacity 0.3s ease;
      }

      .moment-info.fade {
        opacity: 0;
      }

      .moment-title {
        margin: 0;
        font: italic 500 clamp(24px, 3.6vw, 30px) / 1.2 var(--serif);
      }

      .moment-when {
        margin: 8px 0 0;
        font: 500 11px/1.4 var(--sans);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .moment-sky {
        max-width: 620px;
        margin: 12px auto 0;
        font: italic 500 17px/1.55 var(--serif);
        color: var(--muted);
      }

      .moment-ago {
        margin: 8px 0 0;
        font: 500 13px/1.4 var(--sans);
        font-variant-numeric: tabular-nums;
        color: var(--faint);
        min-height: 1.4em;
      }

      @media (max-width: 680px) {
        .orb-stage {
          width: calc(100% + 40px);
          margin-left: -20px;
        }

        .moment {
          width: 50px;
        }

        .moments-line {
          left: 25px;
          right: 25px;
        }

        .moment .moon {
          width: 30px;
          height: 30px;
        }

        .moments-line {
          top: 15px;
        }

        .moment .d {
          font-size: 9.5px;
        }
      }

      /* ---------- little secrets ---------- */
      .note {
        position: fixed;
        left: 50%;
        bottom: max(28px, 7vh);
        z-index: 5;
        max-width: min(640px, calc(100vw - 40px));
        transform: translate(-50%, 14px);
        opacity: 0;
        text-align: center;
        font: italic 500 clamp(18px, 2.6vw, 23px) / 1.4 var(--serif);
        color: var(--text);
        text-shadow: 0 0 18px rgba(255, 214, 170, 0.35), 0 2px 12px rgba(0, 0, 0, 0.6);
        pointer-events: none;
        transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      .note.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .earth-note {
        position: absolute;
        z-index: 2;
        width: max-content;
        max-width: 280px;
        transform: translate(-50%, 0);
        text-align: center;
        font: italic 500 15.5px/1.4 var(--serif);
        color: var(--text);
        text-shadow: 0 0 10px rgba(7, 10, 28, 1), 0 0 4px rgba(7, 10, 28, 1);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.45s ease;
      }

      .earth-note.show {
        opacity: 1;
      }

      .earth-note .n {
        display: block;
        margin-bottom: 5px;
        font: 500 10px/1 var(--sans);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);
      }

      .moment.future {
        width: 0;
        opacity: 0;
        overflow: hidden;
        pointer-events: none;
        transition: width 0.7s cubic-bezier(0.2, 0.7, 0.2, 1), opacity 0.7s ease;
      }

      .moment.future.shown {
        width: 60px;
        opacity: 1;
        pointer-events: auto;
      }

      html.uniting .page {
        opacity: 0.05;
        pointer-events: none;
      }

      @media (max-width: 680px) {
        .moment.future.shown {
          width: 50px;
        }
      }

      /* ---------- the question at the door ---------- */
      .gate {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(900px 600px at 50% 40%, rgba(7, 10, 28, 0.55), rgba(7, 10, 28, 0.88));
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        transition: opacity 0.8s ease;
      }

      .gate.open {
        opacity: 0;
        pointer-events: none;
      }

      .gate-card {
        width: min(640px, 100%);
        text-align: center;
        padding: 34px 30px 30px;
      }

      .gate-card:hover {
        transform: none;
      }

      .gate-q {
        margin: 4px 0 22px;
        font: italic 500 clamp(15px, 4.1vw, 26px) / 1.3 var(--serif);
        color: var(--text);
        white-space: nowrap;
      }

      .gate-row {
        display: flex;
        gap: 10px;
      }

      .gate-row input {
        flex: 1;
        min-width: 0;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        color: var(--text);
        font: 500 16px var(--sans);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .gate-row input::placeholder {
        color: var(--faint);
      }

      .gate-row input:focus {
        border-color: rgba(255, 143, 163, 0.6);
        box-shadow: 0 0 0 3px rgba(255, 143, 163, 0.18);
      }

      .gate-row button {
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        font: 600 14px var(--sans);
        letter-spacing: 0.04em;
        color: #2a0f18;
        background: linear-gradient(135deg, #ffd1dc, #ff8fa3);
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      .gate-row button:hover {
        filter: brightness(1.06);
      }

      .gate-row button:active {
        transform: scale(0.97);
      }

      .gate-msg {
        margin: 14px 0 0;
        min-height: 1.4em;
        font-size: 13px;
        color: var(--muted);
      }

      .gate-card.shake {
        animation: shake 0.5s ease;
      }

      @keyframes shake {
        10%, 90% { transform: translateX(-2px); }
        20%, 80% { transform: translateX(4px); }
        30%, 50%, 70% { transform: translateX(-6px); }
        40%, 60% { transform: translateX(6px); }
      }

      html.locked .page {
        visibility: hidden;
      }

      html.locked .reveal {
        animation-play-state: paused;
      }

      /* ---------- entrance ---------- */
      .reveal {
        opacity: 0;
        transform: translateY(16px);
        animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
        animation-delay: var(--delay, 0ms);
      }

      @keyframes rise {
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ---------- responsive ---------- */
      @media (max-width: 680px) {
        .page {
          --sky-pad: 56px;
        }

        .wait-grid {
          grid-template-columns: 1fr;
          gap: 22px;
        }

        .divider {
          width: auto;
          height: 1px;
          background: linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .card {
          padding: 22px 20px;
        }

        .grid .card {
          padding: 22px 20px;
        }

        .wait .clock,
        .grid .card {
          --digit: 34px;
        }
      }

      @media (max-width: 380px) {
        .wait .clock,
        .grid .card {
          --digit: 30px;
        }

        .unit {
          font-size: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .reveal {
          animation: none;
          opacity: 1;
          transform: none;
        }

        .beat,
        .glow,
        .heart.pop {
          animation: none;
        }

        .d.roll {
          animation: none;
        }

        .card,
        .progress .bar {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="note" id="note" aria-live="polite"></div>

    <div class="gate" id="gate" role="dialog" aria-labelledby="gate-q">
      <form class="card gate-card" id="gate-form" autocomplete="off">
        <p class="gate-q" id="gate-q">Where did we go to eat on our second date?</p>
        <div class="gate-row">
          <input id="gate-input" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="your answer" aria-label="Your answer" />
          <button type="submit">Open</button>
        </div>
        <p class="gate-msg" id="gate-msg" aria-live="polite"></p>
      </form>
    </div>

    <main class="page" id="page"></main>

    <script>
      (() => {
        "use strict";

        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const $ = (sel, root = document) => root.querySelector(sel);
        const TAU = Math.PI * 2;
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

        // Everything personal on this page (the words, the dates, the star maps,
        // the photos) lives in secret.bin, encrypted with a key derived from the
        // answer to the question at the door. Nothing below knows the answer.
        const SECRET_URL = "secret.bin";
        const SALT = "neurorj-atieh-pbkdf2-v1";
        const ITERATIONS = 300000;
        const KEY_STORE = "atieh-key";
        let locked = true;
        let traceStart = performance.now() + 900;

        // ---------- helpers ----------
        function parseLocal(s) {
          const [d, t = "00:00"] = s.split("T");
          const [y, m, day] = d.split("-").map(Number);
          const [hh, mm] = t.split(":").map(Number);
          return new Date(y, m - 1, day, hh, mm, 0, 0);
        }

        function fmtDate(d) {
          return d.toLocaleString(undefined, {
            weekday: "long", month: "long", day: "numeric", year: "numeric",
            hour: "numeric", minute: "2-digit",
          });
        }

        function breakdown(ms) {
          const s = Math.max(0, Math.floor(ms / 1000));
          return {
            totalSeconds: s,
            days: Math.floor(s / 86400),
            hours: Math.floor((s % 86400) / 3600),
            minutes: Math.floor((s % 3600) / 60),
            seconds: s % 60,
          };
        }

        // Render a number into per-character spans, animating only the
        // characters that changed (odometer feel).
        function setDigits(el, str) {
          while (el.children.length > str.length) el.removeChild(el.lastChild);
          while (el.children.length < str.length) {
            const s = document.createElement("span");
            s.className = "d";
            el.appendChild(s);
          }
          for (let i = 0; i < str.length; i++) {
            const s = el.children[i];
            if (s.textContent !== str[i]) {
              s.textContent = str[i];
              if (!reduceMotion) {
                s.classList.remove("roll");
                void s.offsetWidth;
                s.classList.add("roll");
              }
            }
          }
        }

        // ---------- clocks ----------
        function makeClock(cfg, opts = {}) {
          const el = document.createElement("div");
          el.className = "clock";
          el.innerHTML =
            '<p class="label"></p>' +
            '<div class="time">' +
            ["days", "hours", "minutes", "seconds"]
              .map((u) => '<div class="u ' + u + '"><span class="n"></span><span class="unit">' + u + "</span></div>")
              .join("") +
            "</div>" +
            '<p class="detail"></p>';

          const when = parseLocal(cfg.date);
          const labelEl = $(".label", el);
          const detailEl = $(".detail", el);
          const n = {};
          const unit = {};
          for (const u of ["days", "hours", "minutes", "seconds"]) {
            n[u] = $(".u." + u + " .n", el);
            unit[u] = $(".u." + u + " .unit", el);
          }
          let wasFuture = null;

          function update(now) {
            const future = when > now;
            const countingDown = !!opts.countdown && future;
            const b = breakdown(countingDown ? when - now : now - when);

            el.classList.toggle("countdown", countingDown);
            labelEl.textContent = opts.countdown && !future && cfg.labelPast ? cfg.labelPast : cfg.label;

            setDigits(n.days, b.days.toLocaleString());
            setDigits(n.hours, String(b.hours).padStart(2, "0"));
            setDigits(n.minutes, String(b.minutes).padStart(2, "0"));
            setDigits(n.seconds, String(b.seconds).padStart(2, "0"));
            unit.days.textContent = b.days === 1 ? "day" : "days";
            unit.hours.textContent = b.hours === 1 ? "hour" : "hours";
            unit.minutes.textContent = b.minutes === 1 ? "minute" : "minutes";
            unit.seconds.textContent = b.seconds === 1 ? "second" : "seconds";
            detailEl.textContent = fmtDate(when);

            const crossed = wasFuture === true && !future;
            wasFuture = future;
            return { future, crossed };
          }

          return { el, when, update };
        }

        let nextSeenClock = null;

        function initClocks(EVENTS) {
          const waitClocks = $("#wait-clocks");
          const lastSeen = makeClock(EVENTS.lastSeen);
          const nextSeen = makeClock(EVENTS.nextSeen, { countdown: true });
          nextSeenClock = nextSeen;
          const divider = document.createElement("div");
          divider.className = "divider";
          waitClocks.append(lastSeen.el, divider, nextSeen.el);

          const metAt = parseLocal(EVENTS.met.date);
          const SYNODIC_MS = 29.530588853 * 86400000;
          const REF_FULL_MOON = Date.UTC(2000, 0, 21, 4, 40); // a known full moon
          function fullMoonsBetween(a, b) {
            const n = (t) => Math.floor((t - REF_FULL_MOON) / SYNODIC_MS);
            return Math.max(0, n(b) - n(a));
          }

          const STATS = [
            { what: "heartbeats",         calc: (s) => Math.floor(s * (70 / 60)).toLocaleString() },
            { what: "sunrises",           calc: (s) => Math.floor(s / 86400).toLocaleString() },
            { what: "full moons",         calc: (s, now) => fullMoonsBetween(metAt, now).toLocaleString() },
            { what: "km around the Sun",  calc: (s) => Math.floor(s * 29.78).toLocaleString() },
          ];
          const statsEl = $("#stats");
          const statTiles = STATS.map((st, i) => {
            const tile = document.createElement("div");
            tile.className = "card tile reveal";
            tile.style.setProperty("--delay", 700 + i * 70 + "ms");
            tile.innerHTML = '<div class="big"></div><div class="what"></div>';
            $(".what", tile).textContent = st.what;
            statsEl.appendChild(tile);
            return { st, big: $(".big", tile) };
          });

          const bar = $("#bar");
          const progressLeft = $("#progress-left");
          const progressRight = $("#progress-right");
          const waitCard = $("#wait");

          function updateProgress(now) {
            const start = lastSeen.when.getTime();
            const end = nextSeen.when.getTime();
            const total = end - start;
            let frac = total > 0 ? (now - start) / total : 1;
            frac = Math.min(1, Math.max(0, frac));
            bar.style.width = (frac * 100).toFixed(2) + "%";
            if (now >= end) {
              progressLeft.textContent = "The wait is over";
              progressRight.textContent = "♥";
              waitCard.classList.add("done");
            } else {
              progressLeft.textContent = "The wait";
              progressRight.textContent = Math.floor(frac * 100) + "% behind us";
              waitCard.classList.remove("done");
            }
          }

          function tick() {
            const now = new Date();
            lastSeen.update(now);
            const r = nextSeen.update(now);
            updateProgress(now.getTime());

            const sinceMet = Math.max(0, Math.floor((now - metAt) / 1000));
            for (const t of statTiles) setDigits(t.big, t.st.calc(sinceMet, now));

            if (r.crossed) celebrate();
          }

          tick();
          // Align updates to the wall-clock second so seconds never skip.
          setTimeout(() => {
            tick();
            setInterval(tick, 1000);
          }, 1000 - (Date.now() % 1000));
        }

        // ---------- starfield ----------
        const sky = $("#sky");
        const fx = $("#fx");
        const sctx = sky.getContext("2d");
        const fctx = fx.getContext("2d");
        let W = 0, H = 0;
        let stars = [];
        const shots = [];
        let nextShot = 2500;
        const STAR_COLORS = {
          white: "255, 255, 255",
          rose: "255, 190, 205",
          sky: "190, 225, 255",
        };

        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth;
          H = window.innerHeight;
          for (const [c, ctx] of [[sky, sctx], [fx, fctx]]) {
            c.width = Math.round(W * dpr);
            c.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          }
          const count = Math.min(420, Math.round((W * H) / 5200));
          stars = [];
          for (let i = 0; i < count; i++) {
            const roll = Math.random();
            stars.push({
              x: Math.random() * W,
              y: Math.random() * H,
              r: Math.random() * 1.25 + 0.35,
              a: Math.random() * 0.5 + 0.25,
              ph: Math.random() * TAU,
              sp: Math.random() * 1.4 + 0.3,
              c: roll < 0.12 ? STAR_COLORS.rose : roll < 0.3 ? STAR_COLORS.sky : STAR_COLORS.white,
              drift: Math.random() * 0.012 + 0.004,
            });
          }
          layoutFigures();
          if (reduceMotion) drawSky(0);
        }

        function spawnShot() {
          const angle = (28 + Math.random() * 20) * (Math.PI / 180);
          const speed = 700 + Math.random() * 380;
          shots.push({
            x: Math.random() * W * 0.9,
            y: Math.random() * H * 0.45,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: 0.9 + Math.random() * 0.45,
            len: 110 + Math.random() * 90,
          });
        }

        function drawSky(t, dt = 0) {
          sctx.clearRect(0, 0, W, H);
          const hk = heartSkyLevel(t);
          const twBoost = 1 + 0.6 * sunFlare;
          for (const s of stars) {
            const tw = reduceMotion ? 1 : 0.62 + 0.38 * Math.sin(t * 0.0011 * s.sp + s.ph);
            const a = Math.min(1, s.a * tw * twBoost);
            if (hk < 1) {
              sctx.fillStyle = "rgba(" + s.c + "," + (a * (1 - hk)).toFixed(3) + ")";
              sctx.beginPath();
              sctx.arc(s.x, s.y, s.r, 0, TAU);
              sctx.fill();
            }
            if (hk > 0) {
              sctx.save();
              sctx.translate(s.x, s.y);
              sctx.fillStyle = "rgba(255, 150, 172," + Math.min(1, a * 1.3 * hk).toFixed(3) + ")";
              heartPath(sctx, s.r * 4.5 + 2.5);
              sctx.fill();
              sctx.restore();
            }
            if (!reduceMotion) {
              s.y += s.drift;
              if (s.y > H + 2) s.y = -2;
            }
          }
          if (sunFlare > 0.01) {
            const g = sctx.createRadialGradient(W / 2, H * 0.4, 0, W / 2, H * 0.4, Math.max(W, H) * 0.7);
            g.addColorStop(0, "rgba(255, 200, 140," + (0.13 * sunFlare).toFixed(3) + ")");
            g.addColorStop(1, "rgba(255, 200, 140, 0)");
            sctx.fillStyle = g;
            sctx.fillRect(0, 0, W, H);
          }
          drawFigures(t, dt);
          if (reduceMotion) return;

          if (t > nextShot) {
            spawnShot();
            nextShot = t + 6000 + Math.random() * 9000;
          }
          for (let i = shots.length - 1; i >= 0; i--) {
            const sh = shots[i];
            sh.x += sh.vx * dt;
            sh.y += sh.vy * dt;
            sh.life -= sh.decay * dt;
            if (sh.life <= -0.35 || sh.x > W + 200 || sh.y > H + 200) {
              shots.splice(i, 1);
              continue;
            }
            if (sh.life <= 0) continue;
            const mag = Math.hypot(sh.vx, sh.vy);
            const tx = sh.x - (sh.vx / mag) * sh.len;
            const ty = sh.y - (sh.vy / mag) * sh.len;
            const g = sctx.createLinearGradient(sh.x, sh.y, tx, ty);
            const a = Math.min(1, sh.life) * 0.9;
            g.addColorStop(0, "rgba(255,255,255," + a.toFixed(3) + ")");
            g.addColorStop(1, "rgba(255,255,255,0)");
            sctx.strokeStyle = g;
            sctx.lineWidth = 1.6;
            sctx.lineCap = "round";
            sctx.beginPath();
            sctx.moveTo(sh.x, sh.y);
            sctx.lineTo(tx, ty);
            sctx.stroke();
          }
        }

        // ---------- constellations (the two of us) ----------
        // Each figure has stars [x, y, magnitude] as fractions of the figure
        // width (0 eyes, with the iris radius as a fourth value; 1 crown;
        // 2 outline; 3 detail; 4 a curve vertex with no star), lines
        // [a, b, weight], a cloud of faint stars [x, y, brightness] in
        // thousandths of the width that follow the light in the photo, and the
        // masked photo with its place in the frame.
        const FIGS = [];
        let figMode = "wide";
        let pointerX = window.innerWidth / 2;
        const EDGE_DUR = 420;   // ms for one line to draw

        function initFigures(p) {
          for (const d of p.figures) {
            const src = p.constellations[d.key];
            if (!src) continue;
            const firstEdge = new Array(src.points.length).fill(Infinity);
            src.edges.forEach((e, i) => {
              firstEdge[e[0]] = Math.min(firstEdge[e[0]], i);
              firstEdge[e[1]] = Math.min(firstEdge[e[1]], i);
            });
            // group consecutive lines into strokes so curves draw as one path
            const strokes = [];
            let cur = null;
            src.edges.forEach((e, i) => {
              const w = e.length > 2 ? e[2] : 1;
              if (cur && cur.idx[cur.idx.length - 1] === e[0] && cur.w === w) {
                cur.idx.push(e[1]);
              } else {
                cur = { start: i, idx: [e[0], e[1]], w };
                strokes.push(cur);
              }
            });
            // ms between successive lines, so the whole trace takes about six seconds
            const step = clamp(6500 / Math.max(1, src.edges.length), 10, 55);
            const halo = document.createElement("canvas");
            halo.width = halo.height = 64;
            const hg = halo.getContext("2d");
            const grd = hg.createRadialGradient(32, 32, 0, 32, 32, 32);
            grd.addColorStop(0, "rgba(" + d.tint + ",0.6)");
            grd.addColorStop(0.35, "rgba(" + d.tint + ",0.18)");
            grd.addColorStop(1, "rgba(" + d.tint + ",0)");
            hg.fillStyle = grd;
            hg.fillRect(0, 0, 64, 64);
            // the photo itself, masked to the head, shown on hover or tap
            let photo = null;
            if (src.photo && p.photos && p.photos[d.key]) {
              photo = { img: new Image(), box: src.photo, ready: false };
              photo.img.onload = () => { photo.ready = true; };
              photo.img.src = "data:image/webp;base64," + p.photos[d.key];
            }
            FIGS.push({
              ...d, aspect: src.aspect, pts: src.points, edges: src.edges, strokes, step, cloud: src.cloud || [],
              firstEdge, halo, photo, box: null, cloudCanvas: null, cloudPad: 8,
              glow: 0, pulse: 0, hover: false, reveal: 0, revealUntil: 0,
            });
          }
          layoutFigures();
        }

        function layoutFigures() {
          const page = $(".page");
          if (!FIGS.length) return;
          const wide = W >= 1180;
          figMode = wide ? "wide" : "banner";
          let maxH = 0;
          for (const f of FIGS) {
            let fw, cxp;
            if (wide) {
              const margin = (W - 840) / 2;
              fw = clamp(margin * 0.66, 170, 300);
              fw = Math.min(fw, (H * 0.78) / f.aspect);
              cxp = f.side === "left" ? margin / 2 : W - margin / 2;
            } else {
              fw = W < 680 ? W * 0.34 : Math.min(200, W * 0.2);
              const gap = fw * 0.68;
              cxp = W / 2 + (f.side === "left" ? -gap : gap);
            }
            const fh = fw * f.aspect;
            f.box = { x: cxp - fw / 2, y: wide ? H * 0.47 - fh / 2 : 0, w: fw, h: fh };
            f.cloudCanvas = null;
            maxH = Math.max(maxH, fh);
          }
          if (wide) {
            page.style.removeProperty("--sky-pad");
          } else {
            const top = 30;
            for (const f of FIGS) f.box.y = top + (maxH - f.box.h) / 2;
            page.style.setProperty("--sky-pad", Math.round(top + maxH + 76) + "px");
          }
        }

        function renderCloud(f) {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const pad = f.cloudPad;
          const c = document.createElement("canvas");
          c.width = Math.ceil((f.box.w + pad * 2) * dpr);
          c.height = Math.ceil((f.box.h + pad * 2) * dpr);
          const g = c.getContext("2d");
          g.scale(dpr, dpr);
          const s = f.box.w / 1000;
          const r = clamp(f.box.w / 260, 0.45, 1.1);
          for (const [x, y, b] of f.cloud) {
            g.fillStyle = "rgba(" + f.tint + "," + (0.1 + 0.09 * b).toFixed(3) + ")";
            g.beginPath();
            g.arc(pad + x * s, pad + y * s, r * (0.7 + 0.05 * b), 0, TAU);
            g.fill();
          }
          f.cloudCanvas = c;
        }

        function figureOffset(f) {
          const b = f.box;
          const wide = figMode === "wide";
          let x = b.x + (wide ? (pointerX - W / 2) * 0.008 : 0);
          let y = b.y + (wide ? -window.scrollY * 0.04 : 0);
          if (uniteK > 0 && f.uniteT) {
            x += (f.uniteT.x - x) * uniteK;
            y += (f.uniteT.y - y) * uniteK;
          }
          return { x, y };
        }

        function drawFigures(t, dt) {
          if (!FIGS.length || locked) return;
          const u = uniteState(t);
          uniteK = u.k;
          const fade = Math.max(u.k, figMode === "banner" ? clamp(1 - (window.scrollY - 40) / 260, 0, 1) : 1);
          if (fade <= 0) return;
          const elapsed = reduceMotion ? 1e9 : t - traceStart;
          for (const f of FIGS) {
            const b = f.box;
            if (!b) continue;
            if (!f.cloudCanvas) renderCloud(f);
            f.glow += ((f.hover ? 1 : 0) - f.glow) * Math.min(1, dt * 5);
            f.pulse = Math.max(0, f.pulse - dt * 0.8);
            const boost = Math.min(1, f.pulse);
            const { x: ox, y: oy } = figureOffset(f);
            const step = f.step;
            const traceLen = f.edges.length * step + EDGE_DUR;

            // a soft warm nebula behind the figure
            const glowIn = reduceMotion ? 1 : clamp((elapsed - 300) / 2500, 0, 1);
            if (glowIn > 0) {
              const gr = b.h * 0.95;
              sctx.globalAlpha = fade * glowIn * (0.16 + 0.1 * boost);
              sctx.drawImage(f.halo, ox + b.w / 2 - gr, oy + b.h * 0.48 - gr, gr * 2, gr * 2);
            }

            // on hover (or for a few seconds after a tap) the photo comes into focus
            // and the stars and lines step back
            const wantReveal = f.hover || t < f.revealUntil;
            f.reveal += ((wantReveal ? 1 : 0) - f.reveal) * Math.min(1, dt * 2.5);
            const mute = 1 - 0.7 * f.reveal;
            if (f.photo && f.photo.ready && f.reveal > 0.01) {
              const pb = f.photo.box;
              sctx.globalAlpha = fade * f.reveal * 0.92;
              sctx.drawImage(f.photo.img, ox + pb.x * b.w, oy + pb.y * b.w, pb.w * b.w, pb.h * b.w);
            }

            // the photo's light, as a cloud of faint stars drifting in after the lines
            const cloudIn = reduceMotion ? 1 : clamp((elapsed - traceLen * 0.55) / 2200, 0, 1);
            if (cloudIn > 0) {
              const breathe = reduceMotion ? 0 : 0.05 * Math.sin(t * 0.0006 + (f.side === "left" ? 0 : 2));
              sctx.globalAlpha = fade * cloudIn * (0.58 + 0.42 * boost + breathe) * (1 - 0.8 * f.reveal);
              sctx.drawImage(f.cloudCanvas, ox - f.cloudPad, oy - f.cloudPad, b.w + 2 * f.cloudPad, b.h + 2 * f.cloudPad);
            }

            // strokes, drawn in one after another
            sctx.globalAlpha = fade;
            sctx.lineCap = "round";
            sctx.lineJoin = "round";
            for (const st of f.strokes) {
              if (elapsed <= st.start * step) break;
              sctx.strokeStyle = "rgba(" + f.tint + "," + ((0.2 + 0.25 * boost) * st.w * mute).toFixed(3) + ")";
              sctx.lineWidth = st.w >= 0.9 ? 1 : 0.75;
              sctx.beginPath();
              let A = f.pts[st.idx[0]];
              sctx.moveTo(ox + A[0] * b.w, oy + A[1] * b.w);
              for (let k = 0; k + 1 < st.idx.length; k++) {
                const p = clamp((elapsed - (st.start + k) * step) / EDGE_DUR, 0, 1);
                if (p <= 0) break;
                const B = f.pts[st.idx[k + 1]];
                const ax = ox + A[0] * b.w, ay = oy + A[1] * b.w;
                const bx = ox + B[0] * b.w, by = oy + B[1] * b.w;
                sctx.lineTo(ax + (bx - ax) * p, ay + (by - ay) * p);
                if (p < 1) break;
                A = B;
              }
              sctx.stroke();
            }

            // stars, popping in as the lines reach them (magnitude 4 = curve vertex, no star)
            const rs = clamp(b.w / 240, 0.75, 1.15);
            for (let k = 0; k < f.pts.length; k++) {
              const P = f.pts[k];
              if (P[2] === 4) continue;
              const startAt = f.firstEdge[k] === Infinity ? f.edges.length * step : f.firstEdge[k] * step;
              const s = clamp((elapsed - startAt) / 350, 0, 1);
              if (s <= 0) continue;
              const ease = 1 - Math.pow(1 - s, 3);
              const m = P[2];  // 0 = eyes, 1 = crown, 2 = outline, 3 = detail
              const tw = reduceMotion ? 1 : 0.85 + 0.15 * Math.sin(t * 0.0021 + k * 1.7);
              // eyes are sized from the iris in the photo (P[3] = iris radius in figure widths),
              // so the star sits on the pupil whatever the size of the face
              const base = m === 0
                ? clamp((P[3] || 0.012) * b.w * 0.3, 1.0, 2.6)
                : (m === 1 ? 2.6 : m === 2 ? 1.9 : 1.2) * rs;
              const r = base * ease * tw * (1 + 0.25 * boost);
              const x = ox + P[0] * b.w, y = oy + P[1] * b.w;
              if (m <= 2) {
                const hr = r * (m === 0 ? 5.5 : m === 1 ? 7 : 4.5);
                sctx.globalAlpha = fade * (m <= 1 ? 0.85 : 0.6) * ease * mute;
                sctx.drawImage(f.halo, x - hr, y - hr, hr * 2, hr * 2);
                sctx.globalAlpha = fade;
              }
              sctx.fillStyle = m === 3
                ? "rgba(" + f.tint + "," + (0.8 * ease * mute).toFixed(3) + ")"
                : "rgba(255,255,255," + (0.95 * ease * mute).toFixed(3) + ")";
              sctx.beginPath();
              sctx.arc(x, y, r, 0, TAU);
              sctx.fill();
            }

            // name
            const labelIn = reduceMotion ? 1 : clamp((elapsed - 600) / 900, 0, 1);
            if (labelIn > 0) {
              sctx.globalAlpha = fade * labelIn * (0.55 + 0.35 * boost);
              sctx.fillStyle = "#f6f3f8";
              sctx.font = "italic 500 " + Math.round(14 + 4 * rs) + 'px "Cormorant Garamond", Georgia, serif';
              sctx.textAlign = "center";
              sctx.textBaseline = "top";
              sctx.fillText(f.label, ox + b.w / 2, oy + b.h + 12);
            }
            sctx.globalAlpha = 1;
          }
          drawBridge(u, fade);
        }

        function figureAt(x, y) {
          if (locked) return null;
          for (const f of FIGS) {
            if (!f.box) continue;
            const { x: ox, y: oy } = figureOffset(f);
            if (x >= ox - 16 && x <= ox + f.box.w + 16 && y >= oy - 16 && y <= oy + f.box.h + 44) return f;
          }
          return null;
        }

        window.addEventListener("pointermove", (ev) => {
          pointerX = ev.clientX;
          const hit = figureAt(ev.clientX, ev.clientY);
          for (const f of FIGS) f.hover = f === hit;
          document.body.style.cursor = hit ? "pointer" : "";
        });
        window.addEventListener("pointerdown", (ev) => {
          if (!locked && catchShot(ev.clientX, ev.clientY)) {
            sparkle(ev.clientX, ev.clientY, 30);
            shower();
            if (wishLine) showNote(wishLine, 6500);
            return;
          }
          const f = figureAt(ev.clientX, ev.clientY);
          if (!f) return;
          f.pulse = 1.2;
          if (ev.pointerType !== "mouse") f.revealUntil = performance.now() + 4500;
          const { x: ox, y: oy } = figureOffset(f);
          burst(ox + f.box.w / 2, oy + f.box.h * 0.45, 26);
        });
        if (document.fonts && document.fonts.load) {
          document.fonts.load('italic 500 16px "Cormorant Garamond"').catch(() => {});
        }

        // ---------- hearts ----------
        const parts = [];
        const HEART_COLORS = ["#ff8fa3", "#ffd1dc", "#ffffff", "#ffb3c1", "#7cc4ff", "#ff6b8a"];

        function burst(x, y, count) {
          if (reduceMotion) return;
          for (let i = 0; i < count; i++) {
            const a = Math.random() * TAU;

        function heartPath(ctx, s) {

        let orrery = null;

        const EARTH = PLANETS[2];

        const rgba = (c, a) => "rgba(" + c[0] + ", " + c[1] + ", " + c[2] + ", " + a + ")";
        const mix = (a, b, k) => [0, 1, 2].map((i) => Math.round(a[i] + (b[i] - a[i]) * k));
        const centuries = (ms) => (ms / 86400000 + 2440587.5 - 2451545.0) / 36525;

        function elements(p, T) {
          const [a0, e0, I0, L0, w0, O0] = p.el;
          const [a1, e1, I1, L1, w1, O1] = p.rate;
          const O = (O0 + O1 * T) * RAD;
          const wbar = w0 + w1 * T;
          return { a: a0 + a1 * T, e: e0 + e1 * T, I: (I0 + I1 * T) * RAD, L: L0 + L1 * T, wbar, w: wbar * RAD - O, O };

        // Heliocentric ecliptic x/y (AU) for eccentric anomaly E.
        function orbitPoint(el, E) {
          const xp = el.a * (Math.cos(E) - el.e);
          const yp = el.a * Math.sqrt(1 - el.e * el.e) * Math.sin(E);
          const cw = Math.cos(el.w), sw = Math.sin(el.w), cO = Math.cos(el.O), sO = Math.sin(el.O), cI = Math.cos(el.I);
          return {
            x: (cw * cO - sw * sO * cI) * xp + (-sw * cO - cw * sO * cI) * yp,
            y: (cw * sO + sw * cO * cI) * xp + (-sw * sO + cw * cO * cI) * yp,
          };
        }

        function heliocentric(p, ms) {
          const el = elements(p, centuries(ms));
          const M = ((((el.L - el.wbar) % 360) + 540) % 360 - 180) * RAD;
          let E = M + el.e * Math.sin(M);
          for (let i = 0; i < 10; i++) {
            const dE = (M - (E - el.e * Math.sin(E))) / (1 - el.e * Math.cos(E));
            E += dE;
            if (Math.abs(dE) < 1e-9) break;
          }
          return orbitPoint(el, E);
        }

        // Geocentric ecliptic longitude of the Moon (degrees), good to ~1°.
        function moonLongitude(ms) {
          const d = ms / 86400000 - 10957.5;
          const L = 218.316 + 13.176396 * d;
          const M = (134.963 + 13.064993 * d) * RAD;
          const D = (297.850 + 12.190749 * d) * RAD;
          return L + 6.289 * Math.sin(M) - 1.274 * Math.sin(M - 2 * D) + 0.658 * Math.sin(2 * D);
        }

        // Moon's elongation from the Sun (0 new, 180 full) and lit fraction.
        function moonPhase(ms) {
          const e = heliocentric(EARTH, ms);
          const sunLon = Math.atan2(e.y, e.x) / RAD + 180;
          const elong = (((moonLongitude(ms) - sunLon) % 360) + 360) % 360;
          const lit = (1 - Math.cos(elong * RAD)) / 2;
          const names = ["new", "waxing crescent", "first quarter", "waxing gibbous", "full", "waning gibbous", "last quarter", "waning crescent", "new"];
          return { elong, lit, name: names[Math.round(elong / 45)] };
        }

        function moonGlyph(c, cx, cy, r, elong) {
          const k = Math.cos(elong * RAD);
          c.save();
          c.translate(cx, cy);
          c.fillStyle = "rgba(14, 16, 40, 1)";
          c.beginPath();
          c.arc(0, 0, r, 0, TAU);
          c.fill();
          if (elong >= 180) c.scale(-1, 1);
          const g = c.createRadialGradient(-r * 0.3, -r * 0.3, 0, 0, 0, r);
          g.addColorStop(0, "rgba(255, 253, 248, 0.98)");
          g.addColorStop(1, "rgba(214, 210, 222, 0.92)");
          c.fillStyle = g;
          c.beginPath();
          c.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
          c.ellipse(0, 0, Math.abs(k) * r, r, 0, Math.PI / 2, -Math.PI / 2, k > 0);
          c.closePath();
          c.fill();
          c.restore();
          c.strokeStyle = "rgba(255, 255, 255, 0.16)";
          c.lineWidth = 1;
          c.beginPath();
          c.arc(cx, cy, r, 0, TAU);
          c.stroke();
        }

        function initOrrery(EVENTS, extras) {
          const stage = $("#orrery .orb-stage");
          const canvas = $("#orb");
          const row = $("#moments");
          const fill = $("#moments-fill");
          const infoEl = $("#moment-info");
          const info = { title: $("#moment-title"), when: $("#moment-when"), sky: $("#moment-sky"), ago: $("#moment-ago") };
          if (!stage || !canvas || !row || !infoEl) return;
          const ctx = canvas.getContext("2d");

          const moments = Object.keys(EVENTS)
            .filter((k) => k !== "lastSeen" && k !== "nextSeen")
            .map((k) => {
              const ev = EVENTS[k];
              const when = parseLocal(ev.date);
              return { key: k, title: ev.when || ev.label.replace(/^Since\s+/i, "When "), ms: when.getTime(), when };
            });
          moments.push({ key: "now", title: "Right now", live: true });
          const metMs = moments[0].ms;
          const targetOf = (m) => (m.live ? Date.now() : m.ms);
          // one more moment, a year on from the first, that only shows if you go looking
          const anniv = new Date(moments[0].when.getTime());
          anniv.setFullYear(anniv.getFullYear() + 1);
          moments.push({ key: "anniversary", title: "One year from the day we met", ms: anniv.getTime(), when: anniv, future: true });
          let futureShown = false;
          const lastIdx = () => moments.length - (futureShown ? 1 : 2);
          const reasons = (extras && Array.isArray(extras.reasons) ? extras.reasons : []).filter((r) => typeof r === "string" && r.trim());
          const reasonsTitle = (extras && typeof extras.reasonsTitle === "string" && extras.reasonsTitle.trim()) || "Why I love you";

          // A view from a little above the ecliptic, turned so the stretch
          // of Earth's orbit we've shared sits nearest the viewer.
          const SIN_E = 0.52, PERSP = 0.24;
          let sx = 0, sy = 0;
          for (const m of moments) {
            if (m.future) continue;
            const e = heliocentric(EARTH, targetOf(m));
            const a = Math.atan2(e.y, e.x);
            sx += Math.cos(a);
            sy += Math.sin(a);
          }
          const phi = -Math.PI / 2 - Math.atan2(sy, sx);
          const cphi = Math.cos(phi), sphi = Math.sin(phi);

          let W = 0, Hh = 0, cx = 0, cy = 0, R = 0, scale = 1;
          let orbitBins = [];
          let selected = -1;
          let tDisp = metMs;
          let tween = null;
          let lastNowDraw = 0;
          let tour = null, toured = false, visible = false;
          let hover = null, hoverName = null, hoverA = 0, hoverPos = null;
          let dragging = false, drag = null, suppressClick = false;
          let buttons = [];
          let reasonIdx = 0, reasonTimer = 0, noteOn = false;

          // Compress the radial scale so all eight orbits fit on one disc.
          function mapR(rAU) {
            let i = 0;
            while (i < PLANETS.length - 2 && rAU > PLANETS[i + 1].el[0]) i++;
            const a0 = PLANETS[i].el[0], a1 = PLANETS[i + 1].el[0];
            const b0 = PLANETS[i].band, b1 = PLANETS[i + 1].band;
            return b0 + (b1 - b0) * Math.log(rAU / a0) / Math.log(a1 / a0);
          }

          function project(v) {
            const r = Math.hypot(v.x, v.y) || 1e-9;
            const k = mapR(r) / r;
            const x = v.x * k, y = v.y * k;
            const xr = x * cphi - y * sphi;
            const yr = x * sphi + y * cphi;
            const d = -yr;
            const p = 1 / (1 - d * PERSP);
            return { x: cx + xr * R * p, y: cy + d * SIN_E * R * p, p, d };
          }

          const earthAt = (ms) => project(heliocentric(EARTH, ms));

          function buildOrbits() {
            const T = centuries(tDisp);
            orbitBins = PLANETS.map((p) => {
              const el = elements(p, T);
              const pts = [];
              for (let i = 0; i <= 288; i++) pts.push(project(orbitPoint(el, (i / 288) * TAU)));
              const bins = [];
              for (let b = 0; b < 12; b++) bins.push({ path: new Path2D(), d: 0, n: 0 });
              for (let i = 0; i < pts.length - 1; i++) {
                const a = pts[i], c = pts[i + 1];
                const bin = bins[Math.min(11, Math.max(0, Math.floor(((a.d + 1) / 2) * 12)))];

                bin.path.lineTo(c.x, c.y);
                bin.d += a.d;
                bin.n++;

                const d = b.d / b.n;
                return { path: b.path, alpha: 0.07 + 0.17 * ((d + 1) / 2), width: 1 / (1 - d * PERSP) };

          }

          function resizeStage() {
            const w = Math.max(1, Math.round(stage.clientWidth));

            Hh = Math.round(R * SIN_E * (1 / (1 + PERSP) + 1 / (1 - PERSP)) + 64);
            cx = w / 2;
            cy = 30 + (R * SIN_E) / (1 + PERSP);

          // ----- drawing -----
          function drawSun(t) {

          function drawRing(x, y, r, back) {

            ctx.beginPath();
            ctx.ellipse(0, 0, r * 1.55, r * 1.55 * tilt, 0, 0, TAU);
            ctx.stroke();
            ctx.restore();

          function drawMoonlet(m, lx, ly) {
            const g = ctx.createRadialGradient(m.x + lx * m.r * 0.5, m.y + ly * m.r * 0.5, 0, m.x, m.y, m.r * 1.1);
            g.addColorStop(0, "rgba(236, 236, 240, 1)");
            g.addColorStop(0.6, "rgba(150, 150, 162, 1)");
            g.addColorStop(1, "rgba(40, 42, 60, 1)");

            ctx.beginPath();
            ctx.arc(m.x, m.y, m.r, 0, TAU);
            ctx.fill();

          function drawPlanet(p, q, ms) {
            const r = p.size * scale * q.p;
            const x = q.x, y = q.y;
            const dx = cx - x, dy = cy - y, dl = Math.hypot(dx, dy) || 1;

              ctx.fill();
            }
            if (p.ring) drawRing(x, y, r, false);
            if (moon && !moon.behind) drawMoonlet(moon, lx, ly);
          }

          function draw(t) {
            if (!W) return;
            ctx.clearRect(0, 0, W, Hh);
            const ms = tDisp;

            // a faint haze along the plane of the system
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(1, SIN_E);
            let g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 0.62);
            g.addColorStop(0, "rgba(255, 206, 160, 0.1)");
            g.addColorStop(0.5, "rgba(255, 196, 150, 0.035)");
            g.addColorStop(1, "rgba(255, 196, 150, 0)");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(0, 0, R * 0.62, 0, TAU);
            ctx.fill();
            ctx.restore();

            // orbits, brighter on the near side
            ctx.lineCap = "round";
            for (const bins of orbitBins) {
              for (const b of bins) {
                ctx.lineWidth = b.width;
                ctx.strokeStyle = "rgba(255, 255, 255, " + b.alpha.toFixed(3) + ")";
                ctx.stroke(b.path);
              }
            }

            // the stretch of Earth's orbit we've shared so far
            if (ms > metMs) {
              const days = (ms - metMs) / 86400000;
              const steps = Math.max(2, Math.min(360, Math.ceil(days * 2)));
              ctx.beginPath();
              for (let i = 0; i <= steps; i++) {
                const q = earthAt(metMs + ((ms - metMs) * i) / steps);
                if (i === 0) ctx.moveTo(q.x, q.y);
                else ctx.lineTo(q.x, q.y);
              }
              ctx.lineWidth = 9 * scale;
              ctx.strokeStyle = "rgba(255, 143, 163, 0.09)";
              ctx.stroke();
              ctx.lineWidth = 1.8 * scale;
              ctx.strokeStyle = "rgba(255, 143, 163, 0.5)";
              ctx.stroke();
            }

            const pos = PLANETS.map((p) => ({ p, q: project(heliocentric(p, ms)) }));
            pos.sort((a, b) => a.q.d - b.q.d);
            let sunDrawn = false;
            for (const o of pos) {
              if (!sunDrawn && o.q.d >= 0) {
                drawSun(t);
                sunDrawn = true;
              }
              drawPlanet(o.p, o.q, ms);
            }
            if (!sunDrawn) drawSun(t);

            // the name of whatever the pointer rests on
            if (hoverA > 0.01 && hoverName && !(noteOn && hoverName === EARTH)) {
              const o = pos.find((e) => e.p === hoverName);
              if (o) {
                const r = o.p.size * scale * o.q.p;
                ctx.font = "500 11px Inter, system-ui, sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "top";
                if ("letterSpacing" in ctx) ctx.letterSpacing = "0.1em";
                ctx.fillStyle = "rgba(246, 243, 248, " + (0.75 * hoverA).toFixed(3) + ")";
                ctx.fillText(o.p.name.toUpperCase(), o.q.x, o.q.y + r * (o.p.ring ? 1.9 : 1) + 7 + (1 - hoverA) * 4);
              }
            }
            if (noteOn) placeNote();
          }

          // ----- choosing a moment -----
          const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
          const degBetween = (a, b) => Math.round(((((Math.atan2(b.y, b.x) - Math.atan2(a.y, a.x)) / RAD) % 360) + 360) % 360);

          function phaseWords(ph, tense) {
            const be = tense === true ? "was" : tense === false ? "is" : tense;
            if (ph.name === "new" || ph.name === "full") return be + " " + ph.name;
            return be + " a " + ph.name + ", " + Math.round(ph.lit * 100) + "% lit";
          }

          function fillInfo(m) {
            const at = targetOf(m);
            const ph = moonPhase(at);
            const eNow = heliocentric(EARTH, Date.now());
            info.title.textContent = m.title;
            if (m.live) {
              info.when.textContent = fmtDate(new Date());
              info.sky.textContent = "The Moon " + phaseWords(ph, false) + ". Since we met, Earth has carried us " +
                degBetween(heliocentric(EARTH, metMs), eNow) + "° around the Sun.";
              info.ago.textContent = "";
            } else if (m.future) {
              info.when.textContent = fmtDate(m.when);
              info.sky.textContent = "The Moon " + phaseWords(ph, "will be") + ", and Earth will be right back where it was the day we met.";
              updateAgo();
            } else {
              info.when.textContent = fmtDate(m.when);
              const travelled = degBetween(heliocentric(EARTH, at), eNow);
              info.sky.textContent = "The Moon " + phaseWords(ph, true) + "." +
                (travelled > 0 ? " Since then, Earth has carried us " + travelled + "° around the Sun." : "");
              updateAgo();
            }
          }

          function updateAgo() {
            const m = moments[selected];
            if (!m) return;
            if (m.live) {
              info.when.textContent = fmtDate(new Date());
              return;
            }
            const part = (n, w) => n.toLocaleString() + " " + w + (n === 1 ? "" : "s");
            const words = (b) => part(b.days, "day") + ", " + part(b.hours, "hour") + ", " + part(b.minutes, "minute") + " and " + part(b.seconds, "second");
            if (m.future) {
              info.ago.textContent = "In " + words(breakdown(m.ms - Date.now())) + ". To be continued.";
              return;
            }
            info.ago.textContent = words(breakdown(Date.now() - m.ms)) + " ago";
          }

          function highlight(i) {
            buttons.forEach((b, j) => {
              b.classList.toggle("on", j === i);

            });
          }

          function select(i, byUser, fromDrag) {
            if (byUser) stopTour();
            const m = moments[i];

            selected = i;
            highlight(i);
            fill.style.width = ((i / lastIdx()) * 100).toFixed(2) + "%";
            const to = targetOf(m);
            if (reduceMotion || !W) {
              tDisp = to;
              tween = null;
              draw(performance.now());
            } else {
              const span = Math.abs(to - tDisp) / 86400000;
              tween = { from: tDisp, to, start: performance.now(), dur: fromDrag ? 380 : 700 + Math.min(1700, span * 14) };
            }
            if (changed && !reduceMotion) {
              infoEl.classList.add("fade");
              setTimeout(() => {
                fillInfo(m);
                infoEl.classList.remove("fade");
              }, 240);
            } else {
              fillInfo(m);
            }
          }

          function frame(t) {
            if (tween) {
              const k = Math.min(1, (t - tween.start) / tween.dur);
              tDisp = tween.from + (tween.to - tween.from) * ease(k);
              if (k >= 1) tween = null;
            } else if (selected >= 0 && moments[selected].live && !dragging && t - lastNowDraw > 1000) {
              lastNowDraw = t;
              tDisp = Date.now();
            }
            hoverA += ((hover ? 1 : 0) - hoverA) * 0.14;
            if (visible) draw(t);
          }

          // ----- the row of moons -----
          const shortDate = (d) => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
          buttons = moments.map((m, i) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = m.future ? "moment future" : "moment";
            b.innerHTML = '<canvas class="moon" aria-hidden="true"></canvas><span class="d"></span>';
            $(".d", b).textContent = m.live ? "Now" : shortDate(m.when);
            const ph = moonPhase(targetOf(m));
            b.setAttribute("aria-label", m.title + (m.live ? "" : ", " + fmtDate(m.when)) + ". The Moon " + phaseWords(ph, m.future ? "will be" : !m.live) + ".");
            const mc = $(".moon", b);
            const px = Math.round(34 * dpr);
            mc.width = mc.height = px;
            const c2 = mc.getContext("2d");
            c2.setTransform(dpr, 0, 0, dpr, 0, 0);
            moonGlyph(c2, 17, 17, 12.5, ph.elong);
            b.addEventListener("click", () => {
              if (suppressClick) return;
              select(i, true);
            });
            row.appendChild(b);
            return b;
          });

          // Drag along the row to move through time; let go to settle on a moment.
          function rowFractionRaw(clientX) {
            const a = buttons[0].getBoundingClientRect();
            const z = buttons[lastIdx()].getBoundingClientRect();
            const x0 = a.left + a.width / 2, x1 = z.left + z.width / 2;
            return (clientX - x0) / Math.max(1, x1 - x0);
          }
          const rowFraction = (clientX) => Math.min(1, Math.max(0, rowFractionRaw(clientX)));
          function revealFuture() {
            if (futureShown) return;
            futureShown = true;
            buttons[moments.length - 1].classList.add("shown");
          }
          function timeAt(f) {
            const n = lastIdx();
            const i = Math.min(n - 1, Math.floor(f * n));
            const k = f * n - i;

            return t0 + (t1 - t0) * k;
          }
          row.addEventListener("pointerdown", (ev) => {
            if (ev.pointerType === "mouse" && ev.button !== 0) return;

          });
          row.addEventListener("pointermove", (ev) => {
            if (!drag || ev.pointerId !== drag.id) return;

              row.classList.add("scrubbing");

            tDisp = timeAt(f);
            fill.style.width = (f * 100).toFixed(2) + "%";
            highlight(Math.round(f * lastIdx()));
            if (reduceMotion) draw(performance.now());
          });
          const endDrag = (ev) => {
            if (!drag || ev.pointerId !== drag.id) return;
            const moved = drag.moved;
            drag = null;
            if (!moved) return;
            dragging = false;
            row.classList.remove("scrubbing");

            setTimeout(() => (suppressClick = false), 0);
            select(Math.round(rowFraction(ev.clientX) * lastIdx()), true, true);

          row.addEventListener("pointercancel", endDrag);
          row.addEventListener("keydown", (ev) => {
            if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;

            if (ev.key === "ArrowRight" && selected === lastIdx()) revealFuture();

            select(j, true);
            buttons[j].focus();
          });

          // ----- the scene itself -----
          function canvasPoint(ev) {
            const rect = canvas.getBoundingClientRect();
            return { x: ((ev.clientX - rect.left) / rect.width) * W, y: ((ev.clientY - rect.top) / rect.height) * Hh };
          }
          function planetAt(x, y) {
            let best = null, bestD = 20 * scale;
            for (const p of PLANETS) {
              const q = project(heliocentric(p, tDisp));
              const d = Math.hypot(q.x - x, q.y - y);
              const lim = Math.max(10, p.size * scale * q.p + 7);
              if (d < lim && d < bestD) { bestD = d; best = p; }
            }
            return best;
          }
          canvas.addEventListener("pointermove", (ev) => {
            if (ev.pointerType !== "mouse") return;
            const { x, y } = canvasPoint(ev);
            const best = planetAt(x, y);

            if (best) hoverName = best;

          });

          // Earth keeps a list; each click reads the next line of it
          const earthNote = document.createElement("div");
          earthNote.className = "earth-note";
          earthNote.innerHTML = '<span class="n"></span><span class="t"></span>';
          stage.appendChild(earthNote);
          function placeNote() {
            const q = earthAt(tDisp);
            const r = EARTH.size * scale * q.p;
            earthNote.style.left = q.x.toFixed(1) + "px";
            earthNote.style.top = (q.y + r + 14).toFixed(1) + "px";
          }
          function showReason() {
            const i = reasonIdx;
            reasonIdx = (reasonIdx + 1) % reasons.length;
            $(".n", earthNote).textContent = reasonsTitle + " \u00b7 " + (i + 1) + " of " + reasons.length;
            $(".t", earthNote).textContent = reasons[i];
            placeNote();
            earthNote.classList.add("show");
            noteOn = true;
            clearTimeout(reasonTimer);
            reasonTimer = setTimeout(() => {
              earthNote.classList.remove("show");
              noteOn = false;
            }, 9000);
            if (i === reasons.length - 1) setTimeout(heartSky, 900);
          }
          canvas.addEventListener("click", (ev) => {
            const { x, y } = canvasPoint(ev);
            if (reasons.length && planetAt(x, y) === EARTH) showReason();
          });

          // A slow first pass through every moment, ending on today.
          function startTour() {
            if (!visible || locked || toured || tour || reduceMotion) return;
            toured = true;
            let i = 0;
            const step = () => {
              i++;
              if (i > lastIdx()) { tour = null; return; }
              select(i, false);
              tour = setTimeout(step, 3600);
            };
            tour = setTimeout(step, 2400);
          }
          function stopTour() {
            if (tour) clearTimeout(tour);
            tour = null;
            toured = true;
          }

            new IntersectionObserver((entries) => {
              for (const e of entries) {
                visible = e.isIntersecting;
                if (visible) startTour();
              }
            }, { threshold: 0.3 }).observe(stage);
          } else {
            visible = true;
          }

          if (window.ResizeObserver) new ResizeObserver(resizeStage).observe(stage);
          else window.addEventListener("resize", resizeStage);
          resizeStage();
          select(0, false);
          setTimeout(() => {
            updateAgo();
            setInterval(updateAgo, 1000);
          }, 1000 - (Date.now() % 1000));
          if (reduceMotion) setInterval(() => { if (moments[selected] && moments[selected].live) { tDisp = Date.now(); draw(performance.now()); } }, 60000);

          orrery = { frame, startTour };
        }

        // ---------- little secrets ----------
        const note = $("#note");
        let noteTimer = 0;
        function showNote(text, ms) {
          if (!note) return;
          clearTimeout(noteTimer);
          note.textContent = text;
          note.classList.add("show");
          noteTimer = setTimeout(() => note.classList.remove("show"), ms);
        }

        // the Sun flares and the sky warms for the minute something happened
        let sunFlare = 0, flareTarget = 0;

        // every star becomes a heart for a few seconds
        let heartSkyStart = -1;
        function heartSkyLevel(t) {
          if (heartSkyStart < 0) return 0;
          const e = t - heartSkyStart;
          if (e < 1000) return e / 1000;
          if (e < 5500) return 1;
          if (e < 7500) return 1 - (e - 5500) / 2000;
          heartSkyStart = -1;
          return 0;
        }
        function heartSky() {
          if (reduceMotion) return;
          heartSkyStart = performance.now();
          rain();
        }

        // the two figures drift together, join, and settle back
        let unite = null, uniteK = 0;
        const UNITE_IN = 2400, UNITE_HOLD = 3200, UNITE_OUT = 2400;
        function uniteState(t) {
          if (!unite) return { k: 0, bridge: 0, bridgeA: 0 };
          const e = t - unite.start;
          const ease = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
          if (e < UNITE_IN) return { k: ease(e / UNITE_IN), bridge: 0, bridgeA: 0 };
          if (e < UNITE_IN + UNITE_HOLD) return { k: 1, bridge: clamp((e - UNITE_IN) / 1100, 0, 1), bridgeA: 1 };
          const p = (e - UNITE_IN - UNITE_HOLD) / UNITE_OUT;
          if (p >= 1) {
            unite = null;
            return { k: 0, bridge: 0, bridgeA: 0 };
          }
          return { k: 1 - ease(p), bridge: 1, bridgeA: clamp(1 - p * 2.5, 0, 1) };
        }
        function startUnite() {
          if (unite || locked || reduceMotion || FIGS.length < 2) return;
          const L = FIGS.find((f) => f.side === "left"), Rf = FIGS.find((f) => f.side === "right");
          if (!L || !Rf || !L.box || !Rf.box) return;
          const gap = clamp(Math.min(L.box.w, Rf.box.w) * 0.4, 48, 130);
          L.uniteT = { x: W / 2 - gap / 2 - L.box.w, y: H / 2 - L.box.h / 2 };
          Rf.uniteT = { x: W / 2 + gap / 2, y: H / 2 - Rf.box.h / 2 };
          const pick = (f, rightmost) => {
            let best = 0, bx = rightmost ? -Infinity : Infinity;
            f.pts.forEach((P, i) => {
              if (P[2] > 2) return;
              if (rightmost ? P[0] > bx : P[0] < bx) { bx = P[0]; best = i; }
            });
            return best;
          };
          unite = { start: performance.now(), a: pick(L, true), b: pick(Rf, false), pulsed: false };
          document.documentElement.classList.add("uniting");
          setTimeout(() => document.documentElement.classList.remove("uniting"), UNITE_IN + UNITE_HOLD + 300);
        }
        function drawBridge(u, fade) {
          if (!unite || u.bridge <= 0) return;
          const L = FIGS.find((f) => f.side === "left"), Rf = FIGS.find((f) => f.side === "right");
          if (!L || !Rf || !L.box || !Rf.box) return;
          const oL = figureOffset(L), oR = figureOffset(Rf);
          const A = L.pts[unite.a], B = Rf.pts[unite.b];
          const ax = oL.x + A[0] * L.box.w, ay = oL.y + A[1] * L.box.w;
          const bx = oR.x + B[0] * Rf.box.w, by = oR.y + B[1] * Rf.box.w;
          const p = u.bridge;
          const g = sctx.createLinearGradient(ax, ay, bx, by);
          g.addColorStop(0, "rgba(" + L.tint + ",0.75)");
          g.addColorStop(1, "rgba(" + Rf.tint + ",0.75)");

          sctx.strokeStyle = g;
          sctx.lineWidth = 1;
          sctx.lineCap = "round";
          sctx.beginPath();
          sctx.moveTo(ax, ay);
          sctx.lineTo(ax + (bx - ax) * p, ay + (by - ay) * p);
          sctx.stroke();
          for (let i = 1; i <= 3; i++) {
            const f = i / 4;
            const s = clamp((p - f) / 0.1, 0, 1);
            if (s <= 0) break;
            const x = ax + (bx - ax) * f, y = ay + (by - ay) * f;
            const r = 2 * (1 - Math.pow(1 - s, 3));
            const hr = r * 6;
            sctx.globalAlpha = fade * u.bridgeA * 0.8 * s;
            sctx.drawImage(i === 2 ? Rf.halo : L.halo, x - hr, y - hr, hr * 2, hr * 2);

            sctx.fillStyle = "rgba(255,255,255,0.95)";
            sctx.beginPath();
            sctx.arc(x, y, r, 0, TAU);
            sctx.fill();
          }
          if (p >= 1 && !unite.pulsed) {
            unite.pulsed = true;
            L.pulse = 1.2;
            Rf.pulse = 1.2;
            sparkle((ax + bx) / 2, (ay + by) / 2, 26);
          }
          sctx.globalAlpha = 1;
        }

        // her name, typed anywhere
        let secretWord = "", typed = "", wishLine = "";
        window.addEventListener("keydown", (ev) => {
          if (locked || !secretWord || ev.ctrlKey || ev.metaKey || ev.altKey || ev.key.length !== 1) return;
          const el = ev.target;
          if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable)) return;
          typed = (typed + ev.key.toLowerCase()).slice(-32);
          if (typed.endsWith(secretWord)) {
            typed = "";
            startUnite();
          }
        });

        // a shooting star, caught
        function catchShot(x, y) {
          for (let i = 0; i < shots.length; i++) {
            const sh = shots[i];
            const mag = Math.hypot(sh.vx, sh.vy) || 1;
            const dx = -(sh.vx / mag) * sh.len, dy = -(sh.vy / mag) * sh.len;
            const l2 = dx * dx + dy * dy;
            const u = clamp(l2 ? ((x - sh.x) * dx + (y - sh.y) * dy) / l2 : 0, 0, 1);
            const d = Math.hypot(sh.x + dx * u - x, sh.y + dy * u - y);

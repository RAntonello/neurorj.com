            }
          }
          return false;
        }
        function shower() {
          for (let i = 0; i < 24; i++) setTimeout(spawnShot, 150 + Math.random() * 3200);
          nextShot = performance.now() + 14000;
        }

        function initEggs(p) {
          const ex = p.extras || {};
          wishLine = typeof ex.wish === "string" ? ex.wish.trim() : "";
          const figs = p.figures || [];
          const right = figs.find((f) => f.side === "right") || figs[figs.length - 1];
          secretWord = right ? String(right.label).toLowerCase().normalize("NFKD").replace(/[^a-z]/g, "") : "";
          if (secretWord.length < 3) secretWord = "";

          // the minute each thing happened, every day
          const minutes = Object.keys(p.events)
            .filter((k) => k !== "lastSeen" && k !== "nextSeen")
            .map((k) => {
              const ev = p.events[k];
              const d = parseLocal(ev.date);
              return { hm: d.getHours() * 60 + d.getMinutes(), line: ev.minute || ev.label.replace(/^Since\s+/i, "This is the minute ") + "." };
            });
          let shownKey = "";
          function checkMinute() {
            if (locked) return;
            const d = new Date();
            const hm = d.getHours() * 60 + d.getMinutes();
            const key = d.toDateString() + ":" + hm;
            const hit = minutes.find((m) => m.hm === hm);
            if (!hit || key === shownKey) return;
            shownKey = key;
            const left = Math.max(5000, 60000 - (d.getSeconds() * 1000 + d.getMilliseconds()));
            showNote(hit.line, left);
            flareTarget = 1;
            setTimeout(() => { flareTarget = 0; }, left);
          }
          checkMinute();
          setTimeout(() => {
            checkMinute();
            setInterval(checkMinute, 1000);
          }, 1000 - (Date.now() % 1000));
        }

        // ---------- animation loop ----------
        let last = 0;
        let running = false;
        function frame(t) {
          if (!running) return;
          const dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
          last = t;
          sunFlare += (flareTarget - sunFlare) * Math.min(1, dt * 1.6);
          drawSky(t, dt);
          if (orrery) orrery.frame(t, dt);
          if (parts.length || fxDirty) drawFx(dt);
          requestAnimationFrame(frame);
        }

        function start() {
          if (running || reduceMotion) return;
          running = true;
          last = 0;
          requestAnimationFrame(frame);
        }

        function stop() {
          running = false;
        }

        window.addEventListener("resize", resize);
        document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
        resize();
        start();

        // ---------- building the page once the secret is open ----------
        function buildPage(p) {
          document.title = p.title;
          const page = $("#page");
          page.innerHTML = p.html;
          initClocks(p.events);
          initOrrery(p.events, p.extras);
          initFigures(p);
          initEggs(p);
          const heart = $("#heart");
          if (heart) {
            heart.addEventListener("click", () => {
              const r = heart.getBoundingClientRect();
              burst(r.left + r.width / 2, r.top + r.height / 2, 42);
              heart.classList.remove("pop");
              void heart.offsetWidth;
              heart.classList.add("pop");
            });
            heart.addEventListener("animationend", () => heart.classList.remove("pop"));
          }
        }

        function unlock(animated) {
          locked = false;
          const gate = $("#gate");
          document.documentElement.classList.remove("locked");
          traceStart = performance.now() + (animated ? 700 : 900);
          if (orrery) orrery.startTour();
          if (!gate) return;
          if (animated) {
            gate.classList.add("open");
            setTimeout(() => gate.remove(), 900);
          } else {
            gate.remove();
          }
        }

        // ---------- the question at the door ----------
        const enc = (s) => new TextEncoder().encode(s);
        let secretBuf = null;

        function normaliseAnswer(s) {
          return s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]/g, "");
        }

        async function fetchSecret() {
          if (!secretBuf) {
            const r = await fetch(SECRET_URL);
            if (!r.ok) throw new Error("fetch");
            secretBuf = await r.arrayBuffer();
          }
          return secretBuf;
        }

        async function keyFromAnswer(answer) {
          const base = await crypto.subtle.importKey("raw", enc(normaliseAnswer(answer)), "PBKDF2", false, ["deriveKey"]);
          return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: enc(SALT), iterations: ITERATIONS, hash: "SHA-256" },
            base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
          );
        }

        async function openSecret(key) {
          const buf = new Uint8Array(await fetchSecret());
          if (buf.length < 17 || String.fromCharCode(buf[0], buf[1], buf[2], buf[3]) !== "ATH1") throw new Error("format");
          const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(4, 16) }, key, buf.slice(16));
          return JSON.parse(new TextDecoder().decode(plain));
        }

        async function rememberKey(key) {
          try {
            const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
            localStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw)));
          } catch (e) { /* private mode etc. */ }
        }

        async function rememberedKey() {
          try {
            const b64 = localStorage.getItem(KEY_STORE);
            if (!b64) return null;
            const raw = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
            return await crypto.subtle.importKey("raw", raw, "AES-GCM", true, ["decrypt"]);
          } catch (e) {
            return null;
          }
        }

        (async () => {
          const form = $("#gate-form");
          const input = $("#gate-input");
          const msg = $("#gate-msg");
          const card = $(".gate-card");
          const button = $("button", form);
          if (!window.crypto || !crypto.subtle) {
            msg.textContent = "This page needs a secure (https) connection.";
            return;
          }
          const key = await rememberedKey();
          if (key) {
            try {
              buildPage(await openSecret(key));
              unlock(false);
              return;
            } catch (e) {
              try { localStorage.removeItem(KEY_STORE); } catch (_) { /* ignore */ }
            }
          }
          if (window.matchMedia("(hover: hover)").matches) setTimeout(() => input.focus(), 400);
          let busy = false;
          form.addEventListener("submit", async (ev) => {
            ev.preventDefault();
            if (busy) return;
            const guess = normaliseAnswer(input.value);
            if (!guess) return;
            busy = true;
            button.disabled = true;
            msg.textContent = "…";
            try {
              const k = await keyFromAnswer(guess);
              let payload;
              try {
                payload = await openSecret(k);
              } catch (e) {
                if (e && e.message === "fetch") {
                  msg.textContent = "Couldn't load the page. Check your connection and try again.";
                  return;
                }
                throw e;
              }
              msg.textContent = "♥";
              await rememberKey(k);
              buildPage(payload);
              unlock(true);
            } catch (e) {
              msg.textContent = "Not quite. Try again.";
              card.classList.remove("shake");
              void card.offsetWidth;
              card.classList.add("shake");
              input.select();
            } finally {
              busy = false;
              button.disabled = false;
            }
          });
        })();
      })();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en" class="locked">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#070a1c" />

    <title>&#9829;</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        color-scheme: dark;
        --bg0: #070a1c;
        --bg1: #120f30;
        --bg2: #0b0f2e;
        --text: #f6f3f8;
        --muted: rgba(246, 243, 248, 0.62);
        --faint: rgba(246, 243, 248, 0.4);
        --line: rgba(255, 255, 255, 0.1);
        --card: rgba(255, 255, 255, 0.045);
        --rose: #ff8fa3;
        --rose-digit: #ffd6de;
        --sky: #7cc4ff;
        --sky-digit: #d4eaff;
        --serif: "Cormorant Garamond", Georgia, serif;
        --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 60%, var(--bg2) 100%);
        color: var(--text);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* ---------- backdrop ---------- */
      #sky,
      #fx {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      #sky {
        z-index: 0;
      }

      #fx {
        z-index: 3;
        pointer-events: none;
      }

      .glow {
        position: fixed;
        z-index: 0;
        pointer-events: none;
        border-radius: 50%;
      }

      .glow-a {
        width: 70vmax;
        height: 70vmax;
        left: -25vmax;
        top: -30vmax;
        background: radial-gradient(circle, rgba(255, 143, 163, 0.22) 0%, rgba(255, 143, 163, 0) 62%);
        animation: drift-a 28s ease-in-out infinite alternate;
      }

      .glow-b {
        width: 80vmax;
        height: 80vmax;
        right: -35vmax;
        bottom: -40vmax;
        background: radial-gradient(circle, rgba(124, 196, 255, 0.2) 0%, rgba(124, 196, 255, 0) 62%);
        animation: drift-b 36s ease-in-out infinite alternate;
      }

      @keyframes drift-a {
        to {
          transform: translate(8vmax, 6vmax);
        }
      }

      @keyframes drift-b {
        to {
          transform: translate(-8vmax, -5vmax);
        }
      }

      /* ---------- layout ---------- */
      .page {
        position: relative;
        z-index: 1;
        max-width: 840px;
        margin: 0 auto;
        padding: var(--sky-pad, 76px) 20px 64px;
      }

      /* ---------- cards ---------- */
      .card {
        position: relative;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 26px 28px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s ease;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(520px 180px at 12% 0%, rgba(255, 255, 255, 0.07), transparent 60%);
        pointer-events: none;
      }

      .card:hover {
        border-color: rgba(255, 255, 255, 0.18);
        transform: translateY(-2px);
      }

      /* ---------- the question at the door ---------- */
      .gate {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(900px 600px at 50% 40%, rgba(7, 10, 28, 0.55), rgba(7, 10, 28, 0.88));
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        transition: opacity 0.8s ease;
      }

      .gate.open {
        opacity: 0;
        pointer-events: none;
      }

      .gate-card {
        width: min(520px, 100%);
        text-align: center;
        padding: 30px 30px 26px;
      }

      .gate-card:hover {
        transform: none;
      }

      .gate-row {
        display: flex;
        gap: 10px;
      }

      .gate-row input {
        flex: 1;
        min-width: 0;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        color: var(--text);
        font: 500 16px var(--sans);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .gate-row input::placeholder {
        color: var(--faint);
      }

      .gate-row input:focus {
        border-color: rgba(255, 143, 163, 0.6);
        box-shadow: 0 0 0 3px rgba(255, 143, 163, 0.18);
      }

      .gate-row button {
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        font: 600 14px var(--sans);
        letter-spacing: 0.04em;
        color: #2a0f18;
        background: linear-gradient(135deg, #ffd1dc, #ff8fa3);
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      .gate-row button:hover {
        filter: brightness(1.06);
      }

      .gate-row button:active {
        transform: scale(0.97);
      }

      .gate-msg {
        margin: 14px 0 0;
        min-height: 1.4em;
        font-size: 13px;
        color: var(--muted);
      }

      .gate-card.shake {
        animation: shake 0.5s ease;
      }

      @keyframes shake {
        10%, 90% { transform: translateX(-2px); }
        20%, 80% { transform: translateX(4px); }
        30%, 50%, 70% { transform: translateX(-6px); }
        40%, 60% { transform: translateX(6px); }
      }

      html.locked .page {
        visibility: hidden;
      }

      @media (max-width: 680px) {
        .card {
          padding: 22px 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .glow {
          animation: none;
        }

        .card {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>
    <canvas id="fx" aria-hidden="true"></canvas>

    <div class="gate" id="gate" role="dialog" aria-label="Password">
      <form class="card gate-card" id="gate-form" autocomplete="off">
        <div class="gate-row">
          <input id="gate-input" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Password" />
          <button type="submit">Open</button>
        </div>
        <p class="gate-msg" id="gate-msg" aria-live="polite"></p>
      </form>
    </div>

    <main class="page" id="page"></main>

    <script>
      (() => {
        "use strict";

        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const $ = (sel, root = document) => root.querySelector(sel);
        const TAU = Math.PI * 2;
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

        // Everything that is hers (the words, the dates, the star maps, the photos,
        // and the page that shows them) lives in secret.bin, encrypted with a key
        // derived from the answer to the question at the door. Nothing here knows
        // the answer, or what is inside.
        const SECRET_URL = "secret.bin";
        const SALT = "neurorj-atieh-pbkdf2-v1";
        const ITERATIONS = 300000;
        const KEY_STORE = "atieh-key";
        let locked = true;

        // ---------- starfield ----------
        const sky = $("#sky");
        const fx = $("#fx");
        const sctx = sky.getContext("2d");
        const fctx = fx.getContext("2d");
        let W = 0, H = 0;
        let stars = [];
        const shots = [];
        let nextShot = 2500;
        const STAR_COLORS = {
          white: "255, 255, 255",
          rose: "255, 190, 205",
          sky: "190, 225, 255",
        };

        // what the opened page can reach: the canvases, the shooting stars, and
        // hooks into the sky and the frame loop
        const hooks = { before: [], sky: [], frame: [], resize: [] };
        const S = {
          $, clamp, TAU, reduceMotion, sky, fx, sctx, fctx, shots, spawnShot,
          get W() { return W; },
          get H() { return H; },
          delayShots(ms) { nextShot = performance.now() + ms; },
          on(kind, fn) { (hooks[kind] || (hooks[kind] = [])).push(fn); },
          starPainter: null,   // (ctx, star, alpha, t) => true if it drew the star itself
          wash: 0,             // a warm wash over the sky, 0..1
          twinkle: 0,          // extra twinkle, 0..1
        };

        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth;
          H = window.innerHeight;
          for (const [c, ctx] of [[sky, sctx], [fx, fctx]]) {
            c.width = Math.round(W * dpr);
            c.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          }
          const count = Math.min(420, Math.round((W * H) / 5200));
          stars = [];
          for (let i = 0; i < count; i++) {
            const roll = Math.random();
            stars.push({
              x: Math.random() * W,
              y: Math.random() * H,
              r: Math.random() * 1.25 + 0.35,
              a: Math.random() * 0.5 + 0.25,
              ph: Math.random() * TAU,
              sp: Math.random() * 1.4 + 0.3,
              c: roll < 0.12 ? STAR_COLORS.rose : roll < 0.3 ? STAR_COLORS.sky : STAR_COLORS.white,
              drift: Math.random() * 0.012 + 0.004,
            });
          }
          for (const h of hooks.resize) h();
          if (reduceMotion) drawSky(0);
        }

        function spawnShot() {
          const angle = (28 + Math.random() * 20) * (Math.PI / 180);
          const speed = 700 + Math.random() * 380;
          shots.push({
            x: Math.random() * W * 0.9,
            y: Math.random() * H * 0.45,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: 0.9 + Math.random() * 0.45,
            len: 110 + Math.random() * 90,
          });
        }

        function drawSky(t, dt = 0) {
          sctx.clearRect(0, 0, W, H);
          const twBoost = 1 + 0.6 * S.twinkle;
          for (const s of stars) {
            const tw = reduceMotion ? 1 : 0.62 + 0.38 * Math.sin(t * 0.0011 * s.sp + s.ph);
            const a = Math.min(1, s.a * tw * twBoost);
            if (!(S.starPainter && S.starPainter(sctx, s, a, t))) {
              sctx.fillStyle = "rgba(" + s.c + "," + a.toFixed(3) + ")";
              sctx.beginPath();
              sctx.arc(s.x, s.y, s.r, 0, TAU);
              sctx.fill();
            }
            if (!reduceMotion) {
              s.y += s.drift;
              if (s.y > H + 2) s.y = -2;
            }
          }
          if (S.wash > 0.01) {
            const g = sctx.createRadialGradient(W / 2, H * 0.4, 0, W / 2, H * 0.4, Math.max(W, H) * 0.7);
            g.addColorStop(0, "rgba(255, 200, 140," + (0.13 * S.wash).toFixed(3) + ")");
            g.addColorStop(1, "rgba(255, 200, 140, 0)");
            sctx.fillStyle = g;
            sctx.fillRect(0, 0, W, H);
          }
          for (const h of hooks.sky) h(t, dt);
          if (reduceMotion) return;

          if (t > nextShot) {
            spawnShot();
            nextShot = t + 6000 + Math.random() * 9000;
          }
          for (let i = shots.length - 1; i >= 0; i--) {
            const sh = shots[i];
            sh.x += sh.vx * dt;
            sh.y += sh.vy * dt;
            sh.life -= sh.decay * dt;
            if (sh.life <= -0.35 || sh.x > W + 200 || sh.y > H + 200) {
              shots.splice(i, 1);
              continue;
            }
            if (sh.life <= 0) continue;
            const mag = Math.hypot(sh.vx, sh.vy);
            const tx = sh.x - (sh.vx / mag) * sh.len;
            const ty = sh.y - (sh.vy / mag) * sh.len;
            const g = sctx.createLinearGradient(sh.x, sh.y, tx, ty);
            const a = Math.min(1, sh.life) * 0.9;
            g.addColorStop(0, "rgba(255,255,255," + a.toFixed(3) + ")");
            g.addColorStop(1, "rgba(255,255,255,0)");
            sctx.strokeStyle = g;
            sctx.lineWidth = 1.6;
            sctx.lineCap = "round";
            sctx.beginPath();
            sctx.moveTo(sh.x, sh.y);
            sctx.lineTo(tx, ty);
            sctx.stroke();
          }
        }

        // ---------- animation loop ----------
        let last = 0;
        let running = false;
        function frame(t) {
          if (!running) return;
          const dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
          last = t;
          for (const h of hooks.before) h(t, dt);
          drawSky(t, dt);
          for (const h of hooks.frame) h(t, dt);
          requestAnimationFrame(frame);
        }

        function start() {
          if (running || reduceMotion) return;
          running = true;
          last = 0;
          requestAnimationFrame(frame);
        }

        function stop() {
          running = false;
        }

        window.addEventListener("resize", resize);
        document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
        resize();
        start();

        // ---------- opening the page once the secret is open ----------
        // The page itself (its words, styles and code) is part of the secret.
        function openPage(p, animated) {
          if (typeof p.js !== "string") throw new Error("format");
          new Function("S", "p", "animated", p.js)(S, p, animated);
        }

        function unlock(animated) {
          locked = false;
          const gate = $("#gate");
          document.documentElement.classList.remove("locked");
          if (!gate) return;
          if (animated) {
            gate.classList.add("open");
            setTimeout(() => gate.remove(), 900);
          } else {
            gate.remove();
          }
        }

        // ---------- the question at the door ----------
        const enc = (s) => new TextEncoder().encode(s);
        let secretBuf = null;

        function normaliseAnswer(s) {
          return s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]/g, "");
        }

        async function fetchSecret() {
          if (!secretBuf) {
            const r = await fetch(SECRET_URL);
            if (!r.ok) throw new Error("fetch");
            secretBuf = await r.arrayBuffer();
          }
          return secretBuf;
        }

        async function keyFromAnswer(answer) {
          const base = await crypto.subtle.importKey("raw", enc(normaliseAnswer(answer)), "PBKDF2", false, ["deriveKey"]);
          return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: enc(SALT), iterations: ITERATIONS, hash: "SHA-256" },
            base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
          );
        }

        async function openSecret(key) {
          const buf = new Uint8Array(await fetchSecret());
          if (buf.length < 17 || String.fromCharCode(buf[0], buf[1], buf[2], buf[3]) !== "ATH1") throw new Error("format");
          const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(4, 16) }, key, buf.slice(16));
          return JSON.parse(new TextDecoder().decode(plain));
        }

        async function rememberKey(key) {
          try {
            const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
            localStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw)));
          } catch (e) { /* private mode etc. */ }
        }

        async function rememberedKey() {
          try {
            const b64 = localStorage.getItem(KEY_STORE);
            if (!b64) return null;
            const raw = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
            return await crypto.subtle.importKey("raw", raw, "AES-GCM", true, ["decrypt"]);
          } catch (e) {
            return null;
          }
        }

        (async () => {
          const form = $("#gate-form");
          const input = $("#gate-input");
          const msg = $("#gate-msg");
          const card = $(".gate-card");
          const button = $("button", form);
          if (!window.crypto || !crypto.subtle) {
            msg.textContent = "This page needs a secure (https) connection.";
            return;
          }
          const key = await rememberedKey();
          if (key) {
            try {
              openPage(await openSecret(key), false);
              unlock(false);
              return;
            } catch (e) {
              // a remembered key that no longer fits is normal after the password changes
              if (!(e && e.name === "OperationError")) console.error(e);
              try { localStorage.removeItem(KEY_STORE); } catch (_) { /* ignore */ }
            }
          }
          if (window.matchMedia("(hover: hover)").matches) setTimeout(() => input.focus(), 400);
          let busy = false;
          form.addEventListener("submit", async (ev) => {
            ev.preventDefault();
            if (busy) return;
            const guess = normaliseAnswer(input.value);
            if (!guess) return;
            busy = true;
            button.disabled = true;
            msg.textContent = "…";
            try {
              const k = await keyFromAnswer(guess);
              let payload;
              try {
                payload = await openSecret(k);
              } catch (e) {
                if (e && e.message === "fetch") {
                  msg.textContent = "Couldn't load the page. Check your connection and try again.";
                  return;
                }
                throw e;
              }
              msg.textContent = "♥";
              await rememberKey(k);
              openPage(payload, true);
              unlock(true);
            } catch (e) {
              if (!(e && e.name === "OperationError")) console.error(e);
              msg.textContent = "Not quite. Try again.";
              card.classList.remove("shake");
              void card.offsetWidth;
              card.classList.add("shake");
              input.select();
            } finally {
              busy = false;
              button.disabled = false;
            }
          });
        })();
      })();
    </script>
  </body>
</html>
